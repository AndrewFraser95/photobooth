<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phil &amp; Charley's">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0620">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Phil &amp; Charley's Photobooth</title>
<style>
  :root { --a:#ff4f81; --b:#ffb84d; --c:#7a5cff; --ink:#fff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background:#0d0620; }
  html, body { margin:0; position:fixed; top:0; left:0; width:100%; height:100%; min-height:100vh; color:var(--ink); overflow:hidden;
    font-family:"Avenir Next", -apple-system, system-ui, sans-serif;
    background:radial-gradient(circle at 20% 10%, #3a1670 0%, #1b0b3a 55%, #0d0620 100%); }
  .screen { position:fixed; top:0; left:0; width:100%; height:100%; min-height:100vh; display:none; flex-direction:column; align-items:center;
    justify-content:center; padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom); gap:18px; text-align:center; }
  .screen.active { display:flex; }
  .title { margin:0; font-size:40px; line-height:1.05; font-weight:800; letter-spacing:-.5px;
    background:linear-gradient(90deg,var(--b),var(--a),var(--c)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .title small { display:block; font-size:18px; letter-spacing:6px; text-transform:uppercase; margin-top:8px; color:#fff; -webkit-text-fill-color:#fff; opacity:.8; font-weight:600; }
  .label { margin:6px 0 0; opacity:.7; font-size:14px; letter-spacing:2px; text-transform:uppercase; }
  .row { display:flex; gap:10px; }
  button { font:inherit; color:var(--ink); background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.2);
    border-radius:16px; padding:14px 22px; font-size:20px; font-weight:700; min-width:76px; }
  button.sel { background:linear-gradient(135deg,var(--a),var(--c)); border-color:transparent; box-shadow:0 6px 20px rgba(255,79,129,.4); }
  button.big { background:linear-gradient(135deg,var(--b),var(--a)); border:0; font-size:30px; padding:20px 56px;
    border-radius:60px; margin-top:12px; box-shadow:0 10px 30px rgba(255,79,129,.5); }
  button.big:disabled { opacity:.5; }
  #cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:#000; }
  #cam.mirror { transform:scaleX(-1); }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;
    text-shadow:0 4px 24px rgba(0,0,0,.6); }
  #count { font-size:42vmin; font-weight:900; line-height:1; }
  #count.pop { animation:pop 1s ease-out; }
  @keyframes pop { from { transform:scale(1.5); opacity:.2; } to { transform:scale(1); opacity:1; } }
  #progress { position:fixed; top:calc(env(safe-area-inset-top) + 16px); left:0; right:0; display:flex; justify-content:center; gap:10px; }
  #progress i { width:16px; height:16px; border-radius:50%; background:rgba(255,255,255,.35); border:2px solid #fff; }
  #progress i.done { background:var(--a); border-color:var(--a); }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .4s; }
  #flash.on { opacity:1; transition:none; }
  #camScreen { padding:0; display:none; }
  #camScreen.active { display:block; }
  #result { justify-content:flex-start; gap:12px; padding-top:calc(env(safe-area-inset-top) + 14px); padding-bottom:calc(env(safe-area-inset-bottom) + 14px); }
  #stripBox { flex:1 1 0; min-height:0; width:100%; display:flex; justify-content:center; }
  #stripImg { max-width:100%; max-height:100%; object-fit:contain; border-radius:6px; box-shadow:0 10px 40px rgba(0,0,0,.5); -webkit-touch-callout:default; }
  #result button { flex:none; }
  #result button.big { margin-top:0; padding:16px 44px; font-size:26px; }
  .hint { flex:none; position:relative; background:#fff; color:#1b0b3a; border-radius:16px; padding:10px 16px; font-size:16px; font-weight:700; max-width:340px; }
  .hint::after { content:""; position:absolute; left:50%; bottom:-9px; width:18px; height:18px; background:#fff; transform:translateX(-50%) rotate(45deg); }
  .hint b { color:#e0306a; }
  #strip { display:none; }
  #msg { color:#ffb3c6; max-width:340px; min-height:1em; margin:0; }
  .note { font-size:14px; opacity:.75; max-width:320px; margin:0; }
</style>
</head>
<body>

<div id="setup" class="screen active">
  <h1 class="title">Phil &amp; Charley's<small>Photobooth</small></h1>
  <p class="label">Seconds between photos</p>
  <div class="row" id="delays"></div>
  <p class="label">Camera</p>
  <div class="row" id="cams">
    <button data-cam="user">Front</button>
    <button data-cam="environment">Back</button>
  </div>
  <button class="big" id="start">Start</button>
  <p id="msg"></p>
</div>

<div id="camScreen" class="screen">
  <video id="cam" playsinline muted autoplay></video>
  <div id="progress"></div>
  <div id="overlay"><div id="count"></div></div>
  <div id="flash"></div>
</div>

<div id="result" class="screen">
  <div id="stripBox"><img id="stripImg" alt="Your photo strip"></div>
  <canvas id="strip"></canvas>
  <div class="hint">Tap <b>Save to my phone</b>, then tap <b>Save Image</b></div>
  <button id="save" class="big">Save to my phone</button>
  <button id="again">Next guests</button>
</div>

<script>
// ---- Config: change these for other events ----
const CAPTION = "Phil's 60th & Fraser Wedding";
const SHOTS = 4;
const DELAYS = [3, 5, 10];
const CELL_W = 800, CELL_H = 600;   // each photo (4:3), stacked vertically
const GAP = 36, FOOTER_H = 260;
// -----------------------------------------------

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) || d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
let delay = +store.get('delay', 5), facing = store.get('facing', 'user');
let stream = null, wake = null, blob = null, imgUrl = null;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
}

function renderOptions() {
  $('delays').innerHTML = '';
  DELAYS.forEach(d => {
    const b = document.createElement('button');
    b.textContent = d + 's';
    b.className = d === delay ? 'sel' : '';
    b.onclick = () => { delay = d; store.set('delay', d); renderOptions(); };
    $('delays').appendChild(b);
  });
  document.querySelectorAll('#cams button').forEach(b => {
    b.className = b.dataset.cam === facing ? 'sel' : '';
    b.onclick = () => { facing = b.dataset.cam; store.set('facing', facing); renderOptions(); };
  });
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function openCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
  });
  const v = $('cam');
  v.srcObject = stream;
  v.classList.toggle('mirror', facing === 'user');
  await v.play();
}

function grab() {
  const v = $('cam'), c = document.createElement('canvas');
  c.width = CELL_W; c.height = CELL_H;
  const ratio = CELL_W / CELL_H, vw = v.videoWidth, vh = v.videoHeight;
  let sw = vw, sh = vw / ratio;
  if (sh > vh) { sh = vh; sw = vh * ratio; }
  c.getContext('2d').drawImage(v, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, CELL_W, CELL_H);
  return c;
}

async function flash() {
  $('flash').classList.add('on');
  await sleep(80);
  $('flash').classList.remove('on');
}

function wrap(g, text, maxW) {
  const lines = [];
  let cur = '';
  text.split(' ').forEach(w => {
    const t = cur ? cur + ' ' + w : w;
    if (cur && g.measureText(t).width > maxW) { lines.push(cur); cur = w; } else cur = t;
  });
  lines.push(cur);
  return lines;
}

function compose(shots) {
  const W = CELL_W + 2 * GAP, H = GAP + shots.length * (CELL_H + GAP) + FOOTER_H;
  const c = $('strip');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  shots.forEach((s, i) => g.drawImage(s, GAP, GAP + i * (CELL_H + GAP)));
  const top = GAP + shots.length * (CELL_H + GAP);
  const grad = g.createLinearGradient(0, top, W, H);
  grad.addColorStop(0, '#ffb84d'); grad.addColorStop(.5, '#ff4f81'); grad.addColorStop(1, '#7a5cff');
  g.fillStyle = grad; g.fillRect(0, top - GAP / 2, W, FOOTER_H + GAP / 2);
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  // two balanced lines, shrunk to fit
  let size = 84, lines;
  do {
    g.font = `800 ${size}px "Avenir Next", -apple-system, Helvetica, Arial, sans-serif`;
    lines = wrap(g, CAPTION, W - 2 * GAP);
    size -= 4;
  } while ((lines.length > 2 || lines.some(l => g.measureText(l).width > W - 2 * GAP)) && size > 24);
  const lh = (size + 4) * 1.15, mid = top - GAP / 2 + (FOOTER_H + GAP / 2) / 2;
  lines.forEach((l, i) => g.fillText(l, W / 2, mid + (i - (lines.length - 1) / 2) * lh));
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
}

async function save() {
  const file = new File([blob], `photobooth-${Date.now()}.jpg`, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = imgUrl; a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
}

function dots(n) {
  $('progress').innerHTML = '';
  for (let i = 0; i < SHOTS; i++) {
    const d = document.createElement('i');
    if (i < n) d.className = 'done';
    $('progress').appendChild(d);
  }
}

async function run() {
  $('msg').textContent = '';
  $('start').disabled = true;
  try {
    if (!navigator.mediaDevices) throw new Error('Camera needs HTTPS. Open the hosted https:// link in Safari.');
    await openCamera();
  } catch (e) {
    $('msg').textContent = 'Camera error: ' + e.message;
    $('start').disabled = false;
    return;
  }
  try { wake = await navigator.wakeLock?.request('screen'); } catch {}
  show('camScreen');
  const shots = [];
  for (let i = 0; i < SHOTS; i++) {
    dots(i);
    for (let t = delay; t > 0; t--) {
      const c = $('count');
      c.textContent = t; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
      await sleep(1000);
    }
    $('count').textContent = '';
    shots.push(grab());
    await flash();
    await sleep(400);
  }
  dots(SHOTS);
  stream.getTracks().forEach(t => t.stop());
  try { wake?.release(); } catch {}
  blob = await compose(shots);
  if (imgUrl) URL.revokeObjectURL(imgUrl);
  imgUrl = URL.createObjectURL(blob);
  $('stripImg').src = imgUrl;
  show('result');
  $('start').disabled = false;
}

$('start').onclick = run;
$('again').onclick = () => show('setup');
$('save').onclick = save;
renderOptions();
</script>
</body>
</html>
