<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phil &amp; Charley's">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0e0e0e">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Phil &amp; Charley's Photobooth</title>
<style>
  :root { --bg:#0e0e0e; --cream:#f4efe6; --gold:#c8a96a; --ink:#f4efe6; --serif:"Didot","Bodoni 72",Georgia,"Times New Roman",serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background:var(--bg); }
  html, body { margin:0; position:fixed; top:0; left:0; width:100%; height:100%; min-height:100vh; color:var(--ink); overflow:hidden;
    font-family:-apple-system, system-ui, sans-serif; background:var(--bg); }
  body::before { content:""; position:fixed; left:0; right:0; top:-200px; bottom:-200px; background:var(--bg); z-index:-1; }
  .screen { position:fixed; top:0; left:0; width:100%; height:100%; min-height:100vh; display:none; flex-direction:column; align-items:center;
    justify-content:center; padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom); gap:18px; text-align:center; }
  .screen.active { display:flex; }
  .title { margin:0; font-family:var(--serif); font-size:44px; line-height:1.05; font-weight:400; font-style:italic; color:var(--cream); }
  .title small { display:block; font-family:-apple-system, system-ui, sans-serif; font-style:normal; font-size:14px; letter-spacing:7px; text-transform:uppercase; margin-top:12px; color:var(--gold); font-weight:600; }
  .label { margin:6px 0 0; opacity:.6; font-size:13px; letter-spacing:3px; text-transform:uppercase; }
  .row { display:flex; gap:10px; }
  button { font:inherit; color:var(--cream); background:transparent; border:1.5px solid rgba(244,239,230,.35);
    border-radius:12px; padding:14px 22px; font-size:20px; font-weight:600; min-width:76px; }
  button.sel { background:var(--cream); color:#111; border-color:var(--cream); }
  button.big { background:var(--gold); color:#111; border:0; font-size:26px; font-weight:700; padding:18px 52px;
    border-radius:60px; margin-top:12px; }
  button.big:disabled { opacity:.5; }
  #cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:#000; }
  #cam.mirror { transform:scaleX(-1); }
  #count.pop { animation:pop 1s ease-out; }
  @keyframes pop { from { transform:scale(1.4); opacity:.2; } to { transform:scale(1); opacity:1; } }
  #progress { position:fixed; bottom:calc(env(safe-area-inset-bottom) + 24px); left:0; right:0; display:flex; justify-content:center; gap:10px; }
  #progress i { width:14px; height:14px; border-radius:50%; background:rgba(255,255,255,.3); border:2px solid #fff; }
  #progress i.done { background:var(--gold); border-color:var(--gold); }
  #frame { position:fixed; display:flex; align-items:center; justify-content:center; pointer-events:none;
    border:3px solid var(--gold); border-radius:6px; box-shadow:0 0 0 100vmax rgba(0,0,0,.6); }
  #frameHint { position:fixed; left:0; right:0; text-align:center; color:var(--gold); font-size:15px; font-weight:700; letter-spacing:2px;
    text-transform:uppercase; pointer-events:none; }
  #count { font-family:var(--serif); font-weight:400; line-height:1; color:#fff; text-shadow:0 4px 24px rgba(0,0,0,.6); }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .4s; }
  #flash.on { opacity:1; transition:none; }
  #camScreen { padding:0; display:none; }
  #camScreen.active { display:block; }
  #result { justify-content:flex-start; gap:12px; padding-top:calc(env(safe-area-inset-top) + 14px); padding-bottom:calc(env(safe-area-inset-bottom) + 14px); }
  #stripBox { flex:1 1 0; min-height:0; width:100%; display:flex; justify-content:center; }
  #stripImg { max-width:100%; max-height:100%; object-fit:contain; box-shadow:0 10px 40px rgba(0,0,0,.6); -webkit-touch-callout:default; }
  #strip { display:none; }
  #result button { flex:none; }
  #result button.big { margin-top:0; padding:16px 44px; font-size:24px; }
  .hint { flex:none; position:relative; background:var(--cream); color:#111; border-radius:14px; padding:10px 16px; font-size:16px; font-weight:600; max-width:340px; }
  .hint::after { content:""; position:absolute; left:50%; bottom:-9px; width:18px; height:18px; background:var(--cream); transform:translateX(-50%) rotate(45deg); }
  .hint b { color:#8a6a24; }
  #msg { color:#e8a0a0; max-width:340px; min-height:1em; margin:0; }
  .ver { position:absolute; bottom:calc(env(safe-area-inset-bottom) + 6px); font-size:11px; opacity:.3; }
</style>
</head>
<body>

<div id="setup" class="screen active">
  <h1 class="title">Phil &amp; Charley's<small>Photobooth</small></h1>
  <p class="label">Seconds between photos</p>
  <div class="row" id="delays"></div>
  <p class="label">Camera</p>
  <div class="row" id="cams">
    <button data-cam="user">Front</button>
    <button data-cam="environment">Back</button>
  </div>
  <button class="big" id="start">Start</button>
  <p id="msg"></p>
  <span class="ver">v7</span>
</div>

<div id="camScreen" class="screen">
  <video id="cam" playsinline muted autoplay></video>
  <div id="progress"></div>
  <div id="frame"><div id="count"></div></div>
  <div id="frameHint">Keep your heads inside the frame</div>
  <div id="flash"></div>
</div>

<div id="result" class="screen">
  <div id="stripBox"><img id="stripImg" alt="Your photo strip"></div>
  <canvas id="strip"></canvas>
  <div class="hint">Tap <b>Save to my phone</b>, then tap <b>Save Image</b></div>
  <button id="save" class="big">Save to my phone</button>
  <button id="again">Next guests</button>
</div>

<script>
// ---- Config: change these for other events ----
const CAPTION = "Phil's 60th & Fraser Wedding";
const SHOTS = 4;
const DELAYS = [3, 5, 10];
const CELL_W = 800, CELL_H = 600;   // each photo (4:3), stacked vertically
const GAP = 36, FOOTER_H = 260;
// -----------------------------------------------

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) || d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
let delay = +store.get('delay', 5), facing = store.get('facing', 'user');
let stream = null, wake = null, blob = null, imgUrl = null;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
}

function renderOptions() {
  $('delays').innerHTML = '';
  DELAYS.forEach(d => {
    const b = document.createElement('button');
    b.textContent = d + 's';
    b.className = d === delay ? 'sel' : '';
    b.onclick = () => { delay = d; store.set('delay', d); renderOptions(); };
    $('delays').appendChild(b);
  });
  document.querySelectorAll('#cams button').forEach(b => {
    b.className = b.dataset.cam === facing ? 'sel' : '';
    b.onclick = () => { facing = b.dataset.cam; store.set('facing', facing); renderOptions(); };
  });
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function openCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
  });
  const v = $('cam');
  v.srcObject = stream;
  v.classList.toggle('mirror', facing === 'user');
  await v.play();
}

// The gold frame on the preview is exactly what gets captured (WYSIWYG).
function frameRect() {
  const W = innerWidth, m = 14, w = W - 2 * m, h = w / (CELL_W / CELL_H);
  return { x: m, y: 52, w, h };
}

function layoutFrame() {
  const f = frameRect(), fr = $('frame');
  fr.style.left = f.x + 'px'; fr.style.top = f.y + 'px';
  fr.style.width = f.w + 'px'; fr.style.height = f.h + 'px';
  $('count').style.fontSize = Math.round(f.h * 0.7) + 'px';
  $('frameHint').style.top = (f.y + f.h + 12) + 'px';
}

function grab() {
  const v = $('cam'), c = document.createElement('canvas');
  c.width = CELL_W; c.height = CELL_H;
  const W = v.clientWidth, H = v.clientHeight, vw = v.videoWidth, vh = v.videoHeight;
  const k = Math.max(W / vw, H / vh);                       // object-fit: cover scale
  const ox = (W - vw * k) / 2, oy = (H - vh * k) / 2, f = frameRect();
  c.getContext('2d').drawImage(v, (f.x - ox) / k, (f.y - oy) / k, f.w / k, f.h / k, 0, 0, CELL_W, CELL_H);
  return c;
}

async function flash() {
  $('flash').classList.add('on');
  await sleep(80);
  $('flash').classList.remove('on');
}

function wrap(g, text, maxW) {
  const lines = [];
  let cur = '';
  text.split(' ').forEach(w => {
    const t = cur ? cur + ' ' + w : w;
    if (cur && g.measureText(t).width > maxW) { lines.push(cur); cur = w; } else cur = t;
  });
  lines.push(cur);
  return lines;
}

function compose(shots) {
  const W = CELL_W + 2 * GAP, H = GAP + shots.length * (CELL_H + GAP) + FOOTER_H;
  const c = $('strip');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#f7f3ea'; g.fillRect(0, 0, W, H);
  shots.forEach((s, i) => g.drawImage(s, GAP, GAP + i * (CELL_H + GAP)));
  const top = GAP + shots.length * (CELL_H + GAP);
  g.fillStyle = '#c8a96a'; g.fillRect(W / 2 - 60, top + 8, 120, 4);
  g.fillStyle = '#161616'; g.textAlign = 'center'; g.textBaseline = 'middle';
  // two balanced lines, shrunk to fit
  let size = 84, lines;
  do {
    g.font = `italic 400 ${size}px Didot, "Bodoni 72", Georgia, "Times New Roman", serif`;
    lines = wrap(g, CAPTION, W - 2 * GAP);
    size -= 4;
  } while ((lines.length > 2 || lines.some(l => g.measureText(l).width > W - 2 * GAP)) && size > 24);
  const lh = (size + 4) * 1.15, mid = top + 14 + (FOOTER_H - 14) / 2 - 10;
  lines.forEach((l, i) => g.fillText(l, W / 2, mid + (i - (lines.length - 1) / 2) * lh));
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
}

async function save() {
  const file = new File([blob], `photobooth-${Date.now()}.jpg`, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = imgUrl; a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
}

function dots(n) {
  $('progress').innerHTML = '';
  for (let i = 0; i < SHOTS; i++) {
    const d = document.createElement('i');
    if (i < n) d.className = 'done';
    $('progress').appendChild(d);
  }
}

async function run() {
  $('msg').textContent = '';
  $('start').disabled = true;
  try {
    if (!navigator.mediaDevices) throw new Error('Camera needs HTTPS. Open the hosted https:// link in Safari.');
    await openCamera();
  } catch (e) {
    $('msg').textContent = 'Camera error: ' + e.message;
    $('start').disabled = false;
    return;
  }
  try { wake = await navigator.wakeLock?.request('screen'); } catch {}
  show('camScreen');
  layoutFrame();
  const shots = [];
  for (let i = 0; i < SHOTS; i++) {
    dots(i);
    for (let t = delay; t > 0; t--) {
      const c = $('count');
      c.textContent = t; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
      await sleep(1000);
    }
    $('count').textContent = '';
    shots.push(grab());
    await flash();
    await sleep(400);
  }
  dots(SHOTS);
  stream.getTracks().forEach(t => t.stop());
  try { wake?.release(); } catch {}
  blob = await compose(shots);
  if (imgUrl) URL.revokeObjectURL(imgUrl);
  imgUrl = URL.createObjectURL(blob);
  $('stripImg').src = imgUrl;
  show('result');
  $('start').disabled = false;
}

$('start').onclick = run;
$('again').onclick = () => show('setup');
$('save').onclick = save;
addEventListener('resize', layoutFrame);
renderOptions();
</script>
</body>
</html>
